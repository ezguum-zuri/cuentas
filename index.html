<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuentas claras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: claro, amable, rápido; una herramienta de dinero entre amigos sin dramas
   IDEA: el ticket de la cuenta que se reparte en la mesa
   PICTURE: la liquidación como ticket troquelado con flechas "quién paga a quién"
   COLOUR and TYPE: rojo tomate dominante, carbón de apoyo, amarillo limón de acento; Sora + Inter
   LAYOUT: banda roja con total y saldos, pestañas, lista; botón flotante para añadir */
:root{color-scheme:light dark;
--bg:light-dark(#fbf7f2,#16120f);--card:light-dark(#fff,#221c18);--ink:light-dark(#1d1a17,#f5efe8);
--mut:light-dark(#6c645c,#b3a99f);--line:light-dark(#ebe3da,#3a312b);
--red:#e3402b;--redd:light-dark(#c4321f,#ff6a52);--yel:#ffd43b;--pos:light-dark(#1f7a4d,#5fd39a);--neg:light-dark(#c4321f,#ff7a63)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:110px}
h1,h2,h3,.num{font-family:Sora,Inter,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 max(4vw,16px)}
header{background:var(--red);color:#fff;padding:18px 0 26px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top select{flex:1;min-height:44px;background:rgba(0,0,0,.18);border:0;border-radius:12px;padding:0 12px;color:#fff;font:700 18px Sora,sans-serif}
.top select option{color:#1d1a17}
.ib{min-height:44px;min-width:44px;border-radius:12px;border:0;background:rgba(0,0,0,.18);color:#fff;font-weight:600;padding:0 12px}
.tot{margin-top:18px;display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap}
.tot small{display:block;opacity:.85;font-size:14px}
.tot .num{font-size:clamp(36px,9vw,52px);font-weight:800;line-height:1.05}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font:700 14px Sora,sans-serif;color:#1d1a17;flex:none}
header .av{box-shadow:0 0 0 2px var(--red)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px}
nav button{flex:1;min-height:52px;border:0;background:none;font-weight:600;color:var(--mut);border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--red)}
section{padding:20px 0}
h2{font-size:22px;margin:0 0 12px;line-height:1.1}
.search{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 14px;margin-bottom:12px}
.day{font-size:13px;color:var(--mut);margin:16px 0 6px;font-weight:600}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left}
.row .t{flex:1}
.row b{display:block;font-weight:600}
.row span.s{font-size:14px;color:var(--mut)}
.amt{font:700 17px Sora,sans-serif;white-space:nowrap;text-align:right}
.amt small{display:block;font:500 13px Inter,sans-serif;color:var(--mut)}
.pay{border-style:dashed}
.bal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.bl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.bl:last-child{border:0}
.bar{height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.ticket{background:var(--card);border-radius:4px;padding:22px 18px 18px;position:relative;filter:drop-shadow(0 8px 18px rgba(60,30,10,.12));
-webkit-mask:radial-gradient(circle 7px at 50% 0,#0000 98%,#000) 0 0/18px 100% repeat-x;mask:radial-gradient(circle 7px at 50% 0,#0000 98%,#000) 0 0/18px 100% repeat-x}
.ticket h3{margin:0 0 4px;font-size:18px}
.ticket p{margin:0 0 14px;color:var(--mut);font-size:14px}
.tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px dashed var(--line)}
.tr .who{font-size:15px}
.tr .who em{font-style:normal;color:var(--mut)}
.arrow{display:flex;align-items:center;gap:6px}
.arrow svg{flex:none}
.ok{min-height:40px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;padding:0 12px;white-space:nowrap}
.done{text-align:center;padding:26px 8px}
.done .num{font-size:28px;font-weight:800}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(20px + env(safe-area-inset-bottom));z-index:9;min-height:58px;padding:0 24px;border:0;border-radius:29px;background:var(--yel);color:#1d1a17;font:700 17px Sora,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.ov{position:fixed;inset:0;background:rgba(20,10,5,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(4vw,18px) calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
@media(min-width:620px){.ov{align-items:center}.sheet{border-radius:22px}}
.sheet h2{display:flex;justify-content:space-between;align-items:center}
.x{min-width:44px;min-height:44px;border:0;background:var(--line);border-radius:50%;font-size:20px}
label.f{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.in{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 14px;font-size:16px}
textarea.in{min-height:110px;padding:12px;font-size:13px}
.big{font:700 28px Sora,sans-serif;min-height:60px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin:6px 0 10px}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:none;font-weight:600}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mem{display:grid;grid-template-columns:auto minmax(0,1fr) 110px;gap:10px;align-items:center;padding:6px 0}
.mem input[type=checkbox]{width:24px;height:24px;accent-color:var(--red)}
.mem .in{min-height:42px;text-align:right}
.mem .sh{text-align:right;color:var(--mut);font-size:15px}
.hint{font-size:14px;margin:6px 0 0;min-height:20px}
.bad{color:var(--neg)}
.btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.pri{flex:1;min-height:52px;border:0;border-radius:14px;background:var(--red);color:#fff;font:700 17px Sora,sans-serif}
.pri:disabled{opacity:.45}
.sec{min-height:52px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0 16px;font-weight:600}
.del{color:var(--neg)}
.ml{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ml span{flex:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:12px;display:none;gap:12px;align-items:center;z-index:30;max-width:92vw}
.toast.on{display:flex}
.toast button{border:0;background:var(--yel);color:#1d1a17;border-radius:8px;min-height:36px;padding:0 12px;font-weight:700}
.note{font-size:13px;color:var(--mut);margin-top:22px}
.scan{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border:2px dashed var(--red);border-radius:14px;color:var(--redd);font-weight:700;margin-top:12px;cursor:pointer;position:relative}
.scan input{position:absolute;inset:0;opacity:0;cursor:pointer}
.scan.busy{border-style:solid;opacity:.7;pointer-events:none}
.qc{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.qc button{flex:none;min-height:38px;border:1px solid var(--line);background:var(--card);border-radius:19px;padding:0 14px;font-size:15px;white-space:nowrap}
.qc button.r{border-color:var(--red)}
.hs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:16px 0 0}
.hs .n{grid-row:span 2;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font:800 16px Sora,sans-serif}
.hs h3{margin:4px 0 0;font-size:17px}
.hs p{margin:0 0 6px;color:var(--mut);font-size:15px}
.tip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:16px;font-size:15px}
.tip b{display:block;margin-bottom:2px}
.pres{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pres button{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 5px;border-radius:22px;border:2px solid var(--line);background:var(--card);font-weight:600;opacity:.5}
.pres button[aria-pressed=true]{opacity:1;border-color:var(--ink)}
.pres .av{width:30px;height:30px}
.turn{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center}
.turn>small{grid-column:1/-1;color:var(--mut);font-weight:600;font-size:14px}
.turn .av{width:54px;height:54px;font-size:22px;grid-row:span 1}
.turn .who2{font:800 26px/1.1 Sora,sans-serif}
.turn .who2 span{display:block;font:500 14px Inter,sans-serif;color:var(--mut)}
.turn .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.turn .acts .pri{min-height:48px;flex:1 1 160px}
.turn .acts select{flex:1 1 140px;min-height:48px}
.turn.paid{background:transparent;border-style:dashed}
.rt{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}
.rt th,.rt td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.rt th:first-child,.rt td:first-child{text-align:left}
.rt th{font-size:13px;color:var(--mut);font-weight:600}
.rt tr:last-child td{border:0}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <select id="gsel" aria-label="Grupo"></select>
    <button class="ib" id="gedit" aria-label="Editar grupo">Grupo</button>
    <button class="ib" id="gnew" aria-label="Nuevo grupo">+ Nuevo</button>
    <button class="ib" id="help" aria-label="Cómo funciona" style="font:800 20px Sora,sans-serif">?</button>
  </div>
  <div class="tot">
    <div><small>Gasto total del grupo</small><div class="num" id="total">0 €</div></div>
    <div class="chips" id="chips"></div>
  </div>
</div></header>
<nav><div class="wrap" role="tablist">
  <button role="tab" data-t="gastos" aria-selected="true">Gastos</button>
  <button role="tab" data-t="saldos" aria-selected="false">Saldos</button>
  <button role="tab" data-t="liquidar" aria-selected="false">Liquidar</button>
  <button role="tab" data-t="rondas" aria-selected="false">Rondas</button>
</div></nav>
<main class="wrap">
  <section id="v-gastos"><input class="search" id="q" type="search" placeholder="Buscar gasto…" aria-label="Buscar"><div id="list"></div></section>
  <section id="v-saldos" hidden><h2>Quién va a favor y quién debe</h2><div class="bal" id="bal"></div><p class="note">Saldo = lo que ha pagado cada uno menos lo que le corresponde.</p></section>
  <section id="v-liquidar" hidden><div id="settle"></div></section>
  <section id="v-rondas" hidden>
    <div class="seg" id="rmode" style="margin:0 0 16px"><button data-rm="comida">Comida</button><button data-rm="poteo">Poteo</button></div>
    <h2>¿A quién le toca hoy?</h2>
    <p class="hint" style="color:var(--mut);margin:0 0 10px" id="rintro"></p>
    <div class="pres" id="pres"></div>
    <div id="turns"></div>
    <h2 style="margin-top:26px">Cómo vamos</h2>
    <div class="scroll"><table class="rt" id="rtab"></table></div>
    <h2 style="margin-top:26px">Últimos días</h2>
    <div id="rhist"></div>
  </section>
  <p class="note" id="demo">Ane, Iker, Maite y Jon y sus gastos son un ejemplo para ver cómo funciona. Quítalos en Grupo → «Quitar el ejemplo».</p>
</main>
<button class="fab" id="fab">+ Añadir gasto</button>

<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"><span id="tmsg"></span><button id="tundo">Deshacer</button></div>

<script>
{
const COLS=['#ffd43b','#7dd3fc','#fca5a5','#a7f3d0','#c4b5fd','#fdba74','#f9a8d4','#bef264'];
const CATS=['Comida','Súper','Alojamiento','Transporte','Ocio','Casa','Otros'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'});
const eur=c=>fmt.format(c/100);
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const toC=v=>Math.round(parseFloat(String(v).replace(',','.'))*100)||0;
const KEY='cuentas-claras-v1';
const QUICK=['Cena','Comida','Súper','Gasolina','Copas','Entradas','Alojamiento','Taxi'];
const RULES=[['Comida',/cena|comida|almuerzo|desayuno|pintxo|pincho|bar|restaurante|sidrer|asador|pizza|burger|menú|menu|café|cafe|copas|bebida|txoko/i],
 ['Súper',/s[uú]per|eroski|bm\b|mercadona|carrefour|lidl|aldi|dia\b|alcampo|compra|caprabo|consum|froiz|uvesco/i],
 ['Transporte',/gasolin|di[eé]sel|repsol|cepsa|galp|petronor|bp\b|shell|peaje|autopista|taxi|uber|cabify|bus|tren|renfe|euskotren|metro|bizkaibus|aparcamiento|parking|vuelo|avión|barco/i],
 ['Alojamiento',/hotel|casa rural|apartamento|airbnb|booking|hostal|albergue|camping|noche/i],
 ['Ocio',/entrada|cine|teatro|concierto|museo|surf|excursi|actividad|kayak|parque|regalo/i],
 ['Casa',/luz|agua|gas\b|internet|fibra|alquiler|comunidad|limpieza|ikea|leroy|ferreter/i]];
const guessCat=d=>{for(const[c,r]of RULES)if(r.test(d))return c;return null};
function recent(){const seen=new Set,o=[];S.groups.flatMap(g=>g.expenses).filter(x=>x.type==='gasto').sort((a,b)=>b.date.localeCompare(a.date)).forEach(x=>{const k=x.desc.toLowerCase();if(!seen.has(k)&&o.length<6){seen.add(k);o.push(x.desc)}});return o}

// ---- lectura de tickets (OCR en el propio dispositivo con Tesseract.js) ----
let tess=null;
function loadTess(){return tess||(tess=new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=ok;s.onerror=()=>{tess=null;ko(new Error('net'))};document.head.appendChild(s)}))}
function prep(file){return new Promise((ok,ko)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=img.width*k;c.height=img.height*k;const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.6)';x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);ok(c)};img.onerror=ko;img.src=URL.createObjectURL(file)})}
function parseTicket(txt){
  const lines=txt.split('\n').map(l=>l.trim()).filter(Boolean);
  const amts=l=>[...l.matchAll(/(\d{1,4}(?:[.\s]\d{3})*)[,.](\d{2})(?!\d)/g)].map(m=>parseInt(m[1].replace(/[.\s]/g,''))*100+parseInt(m[2]));
  let total=0;
  for(const l of lines){if(/total|importe|a pagar|tarjeta|efectivo|eur/i.test(l)&&!/sub\s*-?total|iva|base|cambio|imp\./i.test(l)){const a=amts(l);if(a.length)total=Math.max(total,a[a.length-1])}}
  if(!total){const all=lines.flatMap(amts).filter(v=>v<500000);total=all.length?Math.max(...all):0}
  const name=(lines.slice(0,6).find(l=>(l.match(/[a-záéíóúñ]/gi)||[]).length>=4&&!/factura|ticket|cif|nif|tel|c\/|calle|avda|www|simplificada|\d{5}/i.test(l))||'')
    .replace(/[^\wáéíóúñü&'. -]/gi,'').replace(/\s+/g,' ').trim().slice(0,40);
  const nice=name?name.toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase()):'';
  return{total,name:nice}}

function equal(total,ids){const n=ids.length,b=Math.floor(total/n),r=total-b*n,o={};ids.forEach((id,i)=>o[id]=b+(i<r?1:0));return o}
function sample(){
  const m=['Ane','Iker','Maite','Jon'].map((n,i)=>({id:'m'+i,name:n}));const ids=m.map(x=>x.id);
  const e=(desc,eu,payer,cat,d,on=ids)=>({id:uid(),desc,amount:eu*100,payer,cat,date:'2026-11-'+d,type:'gasto',split:equal(eu*100,on)});
  return{id:uid(),name:'Finde en Hondarribia',members:m,expenses:[
    e('Casa rural (2 noches)',240,'m0','Alojamiento','14'),e('Gasolina',62,'m1','Transporte','14'),
    e('Pintxos en la parte vieja',58.4,'m2','Comida','14'),e('Compra para el desayuno',31.2,'m3','Súper','15'),
    e('Barco a Hendaya',24,'m1','Ocio','15',['m0','m1','m2']),e('Cena en el puerto',112,'m0','Comida','15')]}
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.groups||!S.groups.length){const g=sample();S={groups:[g],cur:g.id}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const G=()=>S.groups.find(g=>g.id===S.cur)||S.groups[0];
const mem=(g,id)=>g.members.find(m=>m.id===id)||{name:'?',id};
const col=(g,id)=>COLS[Math.max(0,g.members.findIndex(m=>m.id===id))%COLS.length];
const av=(g,id)=>`<span class="av" style="background:${col(g,id)}">${esc(mem(g,id).name[0]||'?').toUpperCase()}</span>`;
let tab='gastos';

const DEMO=/^m[0-3]$/,isDemo=g=>g.members.some(m=>DEMO.test(m.id));
function clearDemo(g){const out=id=>DEMO.test(id);
  g.expenses=g.expenses.filter(x=>!out(x.payer)&&!Object.keys(x.split).some(out));
  g.rounds=(g.rounds||[]).filter(r=>!out(r.who)).map(r=>({...r,present:r.present.filter(id=>!out(id))}));
  g.members=g.members.filter(m=>!out(m.id));g.present=(g.present||[]).filter(id=>!out(id));
  if(g.name==='Finde en Hondarribia')g.name='Mi grupo'}
function balances(g){const b={};g.members.forEach(m=>b[m.id]=0);
  g.expenses.forEach(x=>{b[x.payer]=(b[x.payer]||0)+x.amount;for(const k in x.split)b[k]=(b[k]||0)-x.split[k]});return b}
function settle(b){
  const d=[],c=[];for(const k in b){if(b[k]<-0)d.push([k,-b[k]]);else if(b[k]>0)c.push([k,b[k]])}
  d.sort((a,b)=>b[1]-a[1]);c.sort((a,b)=>b[1]-a[1]);const t=[];let i=0,j=0;
  while(i<d.length&&j<c.length){const v=Math.min(d[i][1],c[j][1]);if(v>0)t.push({from:d[i][0],to:c[j][0],v});
    d[i][1]-=v;c[j][1]-=v;if(!d[i][1])i++;if(!c[j][1])j++}
  return t}

function render(){
  const g=G();S.cur=g.id;save();
  $('#gsel').innerHTML=S.groups.map(x=>`<option value="${x.id}"${x.id===g.id?' selected':''}>${esc(x.name)}</option>`).join('');
  $('#total').textContent=eur(g.expenses.filter(x=>x.type==='gasto').reduce((s,x)=>s+x.amount,0));
  $('#chips').innerHTML=g.members.map(m=>av(g,m.id)).join('');
  $('#demo').hidden=!isDemo(g);

  $('#settle').onclick=e=>{const btn=e.target.closest('[data-s]');if(!btn)return;const x=t[+btn.dataset.s];
    snapshot('Pago registrado');g.expenses.push({id:uid(),type:'pago',desc:'Reembolso',amount:x.v,payer:x.from,split:{[x.to]:x.v},date:today(),cat:''});render()};

// ---- rondas del día (turnos para la ronda y los cafés) ----
const TYPES=[['ronda','Ronda antes de comer','Ronda'],['cafe','Cafés','Cafés'],['copas','Copas','Copas']];const TNAME=Object.fromEntries(TYPES.map(t=>[t[0],t[2]]));
function rstats(g,type){const st={};g.members.forEach(m=>st[m.id]={paid:0,days:0,fair:0,last:''});
  (g.rounds||[]).filter(r=>r.type===type).forEach(r=>{const n=r.present.length||1;r.present.forEach(id=>{if(st[id]){st[id].days++;st[id].fair+=1/n}});
    if(st[r.who]){st[r.who].paid++;if(r.date>st[r.who].last)st[r.who].last=r.date}});return st}
function nextUp(g,type,present,exclude){const st=rstats(g,type);let c=present.filter(id=>!exclude.includes(id));if(!c.length)c=present;
  return c.sort((a,b)=>(st[b].fair-st[b].paid)-(st[a].fair-st[a].paid)||st[a].last.localeCompare(st[b].last)||st[a].paid-st[b].paid)[0]}
function renderRounds(g){
  g.rounds=g.rounds||[];const ids=g.members.map(m=>m.id);
  g.present=(g.present||ids).filter(id=>ids.includes(id));const pr=g.present,t=today(),mode=g.rmode||'comida';
  document.querySelectorAll('#rmode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.rm===mode));
  $('#rintro').textContent=mode==='poteo'?'Marca quién está en el poteo. Cada vez que paguéis una ronda, apúntala y la app dice a quién le toca en el siguiente bar.':'Marca quién ha venido hoy. La app reparte los turnos de forma justa: quien más días viene, más veces paga.';
  $('#pres').innerHTML=g.members.map(m=>`<button data-p="${m.id}" aria-pressed="${pr.includes(m.id)}">${av(g,m.id)}${esc(m.name)}</button>`).join('')||'<div class="empty">Añade personas en «Grupo».</div>';
  if(mode==='poteo'){renderPoteo(g,pr,t);return}
  const todayR=g.rounds.filter(r=>r.date===t);let h='',sugs=[];
  TYPES.forEach(([type,label,art])=>{const done=todayR.find(r=>r.type===type);
    if(done){h+=`<div class="turn paid"><small>${label}</small>${av(g,done.who)}<div class="who2">Hoy pagó ${esc(mem(g,done.who).name)}<span>${done.present.length} personas</span></div><div class="acts"><button class="sec" data-ru="${done.id}">Corregir</button></div></div>`;return}
    if(pr.length<2){h+=`<div class="turn"><small>${label}</small><div class="who2" style="grid-column:1/-1;font-size:18px">Marca al menos a dos personas</div></div>`;return}
    const paidO=todayR.filter(r=>r.type!==type).map(r=>r.who),other=[...new Set([...paidO,...sugs])];const n=nextUp(g,type,[...pr],other);sugs.push(n);
    h+=`<div class="turn"><small>${label}</small>${av(g,n)}<div class="who2">Le toca a ${esc(mem(g,n).name)}<span>${other.length&&!other.includes(n)?'Nadie paga dos cosas el mismo día si hay gente de sobra':'Es quien menos ha pagado para lo que viene'}</span></div>
      <div class="acts"><button class="pri" data-rp="${type}|${n}">Ha pagado ${esc(mem(g,n).name)}</button><select class="in" data-ro="${type}" aria-label="Ha pagado otra persona"><option value="">Pagó otro…</option>${pr.filter(id=>id!==n).map(id=>`<option value="${id}">${esc(mem(g,id).name)}</option>`).join('')}</select></div></div>`});
  $('#turns').innerHTML=h;
  const ST=TYPES.map(t=>rstats(g,t[0]));
  $('#rtab').innerHTML=`<tr><th>Persona</th>${TYPES.map(t=>`<th>${t[2]}</th>`).join('')}<th>Días</th><th>Balance</th></tr>`+g.members.map(m=>{const xs=ST.map(st=>st[m.id]),bal=xs.reduce((a,x)=>a+x.paid-x.fair,0),d=new Set((g.rounds||[]).filter(r=>r.present.includes(m.id)).map(r=>r.date)).size;
    return`<tr><td>${esc(m.name)}</td>${xs.map(x=>`<td>${x.paid}</td>`).join('')}<td>${d}</td><td style="color:${bal>0.25?'var(--pos)':bal<-0.25?'var(--neg)':'var(--mut)'}">${bal>0.25?'+':''}${bal.toFixed(1).replace('.',',')}</td></tr>`}).join('');
  const days=[...new Set(g.rounds.map(r=>r.date))].sort().reverse().slice(0,10);
  $('#rhist').innerHTML=days.map(d=>{const rs=g.rounds.filter(r=>r.date===d);
    return`<div class="row" style="cursor:default"><span class="t"><b>${new Date(d+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'})}</b><span class="s">${rs.map(r=>`${TNAME[r.type]||r.type}: ${esc(mem(g,r.who).name)}`).join(' · ')} · ${rs[0].present.length} personas</span></span></div>`}).join('')||'<div class="empty">Aún no hay turnos apuntados.</div>';
  $('#rtab').insertAdjacentHTML('afterend','');
}
function renderPoteo(g,pr,t){
  const tr=g.rounds.filter(r=>r.type==='poteo'&&r.date===t),last=tr[tr.length-1];let h='';
  if(pr.length<2)h=`<div class="turn"><small>Siguiente ronda</small><div class="who2" style="grid-column:1/-1;font-size:18px">Marca al menos a dos personas</div></div>`;
  else{const n=nextUp(g,'poteo',[...pr],last?[last.who]:[]);
    h=`<div class="turn"><small>Ronda nº ${tr.length+1} de hoy</small>${av(g,n)}<div class="who2">Le toca a ${esc(mem(g,n).name)}<span>${tr.length?'Es quien menos ha pagado contando lo que viene':'Primer bar: empieza quien menos ha pagado'}</span></div>
      <div class="acts"><button class="pri" data-rp="poteo|${n}">Ha pagado ${esc(mem(g,n).name)}</button><select class="in" data-ro="poteo" aria-label="Ha pagado otra persona"><option value="">Pagó otro…</option>${pr.filter(id=>id!==n).map(id=>`<option value="${id}">${esc(mem(g,id).name)}</option>`).join('')}</select></div></div>`}
  if(tr.length)h+=`<div class="turn paid"><small>Hoy llevamos ${tr.length} ${tr.length===1?'ronda':'rondas'}</small><div style="grid-column:1/-1">${tr.map((r,i)=>`${i+1}. ${esc(mem(g,r.who).name)}`).join(' · ')}</div><div class="acts"><button class="sec" data-ru="${last.id}">Deshacer la última</button></div></div>`;
  $('#turns').innerHTML=h;
  const st=rstats(g,'poteo');
  $('#rtab').innerHTML=`<tr><th>Persona</th><th>Pagadas</th><th>Rondas con él</th><th>Balance</th></tr>`+g.members.map(m=>{const x=st[m.id],bal=x.paid-x.fair;
    return`<tr><td>${esc(m.name)}</td><td>${x.paid}</td><td>${x.days}</td><td style="color:${bal>0.25?'var(--pos)':bal<-0.25?'var(--neg)':'var(--mut)'}">${bal>0.25?'+':''}${bal.toFixed(1).replace('.',',')}</td></tr>`}).join('');
  const days=[...new Set(g.rounds.filter(r=>r.type==='poteo').map(r=>r.date))].sort().reverse().slice(0,10);
  $('#rhist').innerHTML=days.map(d=>{const rs=g.rounds.filter(r=>r.type==='poteo'&&r.date===d);
    return`<div class="row" style="cursor:default"><span class="t"><b>${new Date(d+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'})} · ${rs.length} ${rs.length===1?'ronda':'rondas'}</b><span class="s">${rs.map(r=>esc(mem(g,r.who).name)).join(' → ')}</span></span></div>`}).join('')||'<div class="empty">Aún no hay rondas de poteo.</div>';
}

    $('#xdel').onclick=()=>{snapshot('Reembolso eliminado');g.expenses=g.expenses.filter(e=>e!==x);close();render()};return}

    <label class="f" for="fa">Importe (€)</label><input class="in big" id="fa" inputmode="decimal" placeholder="0,00" value="${x?(x.amount/100).toFixed(2).replace('.',','):''}">

    <div class="two"><div><label class="f" for="fp">Pagó</label><select class="in" id="fp">${g.members.map(m=>`<option value="${m.id}"${x&&x.payer===m.id?' selected':''}>${esc(m.name)}</option>`).join('')}</select></div>

    `<label class="f">Compartir con otro móvil</label><p class="hint" style="color:var(--mut)">Copia este código y pégalo en «+ Nuevo» del otro dispositivo.</p><textarea class="in" id="gx" readonly>${esc(btoa(unescape(encodeURIComponent(JSON.stringify(g)))))}</textarea>
    <div class="btns"><button class="sec" id="gcp">Copiar código</button><button class="sec del" id="gdel">Eliminar grupo</button></div>`}`);
    const add=()=>{const v=$('#gm').value.trim();if(!v)return;g.name=$('#gn').value;g.members.push({id:uid(),name:v});draw();$('#gm').focus()};
    $('#ga').onclick=add;$('#gm').onkeydown=e=>{if(e.key==='Enter')add()};
    $('#ml').onclick=e=>{const r=e.target.dataset.r;if(r){g.name=$('#gn').value;g.members=g.members.filter(m=>m.id!==r);draw()}};
    if($('#gdemo'))$('#gdemo').onclick=()=>{snapshot('Ejemplo quitado');g.name=$('#gn').value.trim()||g.name;clearDemo(g);close();render()};
    $('#gs').onclick=()=>{const pend=$('#gm').value.trim();if(pend)g.members.push({id:uid(),name:pend});g.name=$('#gn').value.trim()||'Mi grupo';
      if(isNew)S.groups.push(g);S.cur=g.id;close();render()};
    if(isNew)$('#gim').onclick=()=>{try{const n=JSON.parse(decodeURIComponent(escape(atob($('#gi').value.trim()))));if(!n.members||!n.expenses)throw 0;
        n.id=uid();S.groups.push(n);S.cur=n.id;close();render()}catch(e){$('#gih').innerHTML='<span class="bad">Ese código no es válido.</span>'}};
    else{$('#gcp').onclick=async()=>{const ta=$('#gx');try{await navigator.clipboard.writeText(ta.value);$('#gcp').textContent='Copiado'}catch(e){ta.select();$('#gcp').textContent='Selecciónalo y copia'}};
      $('#gdel').onclick=()=>{snapshot('Grupo eliminado');S.groups=S.groups.filter(x=>x!==g);if(!S.groups.length){const n={id:uid(),name:'Mi grupo',members:[],expenses:[]};S.groups.push(n)}S.cur=S.groups[0].id;close();render()}}
  };draw();
}

const HELP=[
 ['Crea un grupo','Pulsa «+ Nuevo», ponle nombre (piso, viaje, cuadrilla…) y añade a las personas. Puedes tener tantos grupos como quieras y cambiar entre ellos con el menú de arriba.'],
 ['Apunta cada gasto','Pulsa «+ Añadir gasto». Escanea el ticket o escribe el importe, elige el concepto con un toque, quién pagó y entre quiénes se reparte.'],
 ['Elige cómo repartir','«A partes iguales» divide entre los marcados (los céntimos sueltos se reparten solos). «Importes exactos» te deja poner la parte de cada uno; la app avisa si falta o sobra.'],
 ['Mira los saldos','En «Saldos», verde es quien ha puesto de más y le deben; rojo es quien debe. Saldo = lo que pagó menos lo que le toca.'],
 ['Rondas del día','Para la ronda antes de comer, los cafés y las copas, que van aparte. Marca quién ha venido hoy y la app dice a quién le toca cada cosa; si hay gente suficiente, nadie paga dos cosas el mismo día. Las copas solo se apuntan los días que las hay. En modo «Poteo» se apuntan todas las rondas que hagáis, una por bar, y siempre te dice a quién le toca la siguiente. Es justo con la asistencia: quien viene más días paga más veces. «Balance» en positivo es quien ha pagado de más.'],
 ['Liquida con los mínimos pagos','«Liquidar» calcula quién paga a quién con el menor número de transferencias. Cuando se haga un pago, pulsa «Hecho»: queda apuntado como reembolso y todo se recalcula.']];
function helpSheet(){open(head('Cómo funciona')+HELP.map((h,i)=>`<div class="hs"><span class="n">${i+1}</span><h3>${h[0]}</h3><p>${h[1]}</p></div>`).join('')+`
  <div class="tip"><b>Escanear ticket</b>La foto se lee en tu propio móvil, no se envía a ningún sitio. La primera vez tarda un poco más porque descarga el lector. Revisa siempre el importe antes de guardar: un ticket arrugado o con poca luz puede leerse mal.</div>
  <div class="tip"><b>Corregir y deshacer</b>Toca cualquier gasto de la lista para editarlo o eliminarlo. Si borras algo sin querer, tienes unos segundos para pulsar «Deshacer».</div>
  <div class="tip"><b>Dónde se guardan los datos</b>En este dispositivo y navegador. Si borras los datos de Safari, se pierden. Para pasar un grupo a otro móvil: Grupo → «Copiar código», y en el otro móvil «+ Nuevo» → pegar el código → «Importar grupo». Es una copia, no se sincroniza sola.</div>
  <div class="tip"><b>Quitar personas</b>Solo se puede quitar a alguien que no tenga gastos en el grupo, para que las cuentas no se descuadren.</div>
  <div class="btns"><button class="pri x">Entendido</button></div>`)}
$('#help').onclick=helpSheet;
try{if(!localStorage.getItem(KEY+'-help')){localStorage.setItem(KEY+'-help','1');setTimeout(helpSheet,300)}}catch(e){}
$('#fab').onclick=()=>expenseSheet();
$('#list').onclick=e=>{const r=e.target.closest('[data-e]');if(r)expenseSheet(r.dataset.e)};
$('#gsel').onchange=e=>{S.cur=e.target.value;render()};
$('#gedit').onclick=()=>groupSheet(false);
$('#gnew').onclick=()=>groupSheet(true);
$('#q').oninput=render;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
render();
}
</script>
